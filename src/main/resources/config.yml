stack:
  max-blocks: 100000
  blocks-per-tick: 512

language: en_US

clipboard:
  max-blocks: 100000
  blocks-per-tick: 512

smooth:
  max-blocks: 100000
  blocks-per-tick: 512
  max-iterations: 10
  terrain-ids: [1, 2, 3, 12, 13, 24, 48, 80, 82, 110, 159, 172]

surface:
  default-radius: 10
  max-radius: 128
  max-checks: 1000000
  max-blocks: 100000
  blocks-per-tick: 512

# Embedded BoundingBoxAPI renderer; no additional plugin is required.
bounding-boxes:
  selection-enabled: true
  selection-seconds: 0 # 0 keeps the selection box until cleared
  paste-enabled: true
  paste-seconds: 10 # 0 disables the temporary paste box
