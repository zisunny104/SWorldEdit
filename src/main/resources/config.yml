stack:
  max-blocks: 100000
  blocks-per-tick: 512
  tick-millis: 3

progress:
  interval-seconds: 5 # Heartbeat even while waiting for I/O; no invented overall percent or ETA

language: en_US

clipboard:
  max-blocks: 100000
  blocks-per-tick: 512
  tick-millis: 3 # Legacy in-memory paste/copy and schematic preparation
  # max-blocks above remains the memory cap for schematic and other legacy editing paths.
  streaming:
    enabled: true
    max-blocks: 50000000
    page-cells: 2048
    max-states: 8192
    memory-bytes: 1048576
    disk-bytes: 1073741824 # Per clipboard/history file, including framing
    reserve-bytes: 536870912 # Keep this much free disk space
    tick-millis: 3
    max-jobs: 4
    max-history: 10
    max-stores: 128

smooth:
  max-blocks: 100000
  blocks-per-tick: 512
  tick-millis: 3
  underwater: true # Preserve standing-water levels while smoothing the bed and lowered shoreline
  max-iterations: 10
  terrain-ids: [1, 2, 3, 12, 13, 24, 48, 80, 82, 110, 159, 172]

surface:
  default-radius: 10
  max-radius: 128
  max-checks: 1000000
  max-blocks: 100000
  blocks-per-tick: 512
  tick-millis: 3

# Embedded BoundingBoxAPI renderer; no additional plugin is required.
bounding-boxes:
  selection-enabled: true
  selection-seconds: 0 # 0 keeps the selection box until cleared
  paste-enabled: true
  paste-seconds: 10 # 0 disables the temporary paste box
